[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.28"
optimizer = true
optimizer_runs = 200

[rpc_endpoints]
monad_testnet = "https://testnet-rpc.monad.xyz"

# Monad testnet is chain id 10143. Deploy.s.sol asserts block.chainid against that
# value so a deploy pointed at the wrong network fails before it spends any gas.
[etherscan]
monad_testnet = {key = "${ETHERSCAN_API_KEY}", chain = 10143, url = "https://testnet.monadexplorer.com/api"}

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
int_types = "long"
